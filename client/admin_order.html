<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Admin Orders</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="./src/img/coffee-cup.png" type="image/x-icon" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

        <!-- CSS -->
        <link rel="stylesheet" href="./src/css/main.css" />
        <link rel="stylesheet" href="./src/css/admin_orders.css" />
    </head>
    <body style="background-color: #fff">
        <div class="page-wrapper row" style="--bs-gutter-x: 0">
            <div class="sidebar col-md-2">
                <div class="logo m-4">
                    <img src="./src/img/coffee-cup.png" alt="Chill Coffee Logo" class="icon" />
                    <p class="title"><span class="title strong">Chill</span> Coffee</p>
                </div>
                <ul class="menu p-0">
                    <li>
                        <a href="./admin_order.html" class="text-white">Đơn hàng</a>
                    </li>
                    <li>
                        <a href="./admin.html" class="text-white">Sản phẩm</a>
                    </li>
                    <li>
                        <a href="./admin_user.html" class="text-white">Quyền</a>
                    </li>
                    <li>
                        <a href="./index.html" class="text-white">Quay lại</a>
                    </li>
                </ul>
            </div>
            <div class="content-admin col-md-10 p-4">
                <div class="d-flex gap-3 mb-3">
                    <div class="order-input-wrap d-flex">
                        <input type="text" id="order-search" class="form-control" placeholder="Tìm theo tên khách, số bàn, tên món..." />
                        <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <button id="clearInput" class="clear-input-btn">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </button>
                    </div>
                    <select id="table-filter" class="form-select" style="width: 150px">
                        <option value="">Tất cả bàn</option>
                        <option value="1">Bàn 1</option>
                        <option value="2">Bàn 2</option>
                        <option value="3">Bàn 3</option>
                        <option value="4">Bàn 4</option>
                        <option value="5">Bàn 5</option>
                        <!-- Thêm bàn khác tùy theo thực tế -->
                    </select>

                    <!-- Lọc theo trạng thái -->
                    <select id="status-filter">
                        <option value="">-- Trạng thái --</option>
                        <option value="0">Chờ xác nhận</option>
                        <option value="1">Đang pha chế</option>
                        <option value="2">Hoàn thành</option>
                        <option value="3">Đã hủy</option>
                    </select>
                </div>

                <div class="product-table p-4 shadow-md rounded-md">
                    <h5>Danh sách đơn hàng</h5>
                    <table class="table table-hover">
                        <thead>
                            <tr class="text-center">
                                <th>Thời gian</th>
                                <th>Bàn số</th>
                                <th>Khách hàng</th>
                                <th>Tên sản phẩm</th>
                                <th>Số lượng</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="order-list-admin"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- Bootstrap 5 JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <!-- Page-specific JS -->
        <script type="module" src="./src/js/admin_orders.js"></script>
    </body>
</html>
