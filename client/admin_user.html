<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Trang Phân Quyền</title>
        <link rel="shortcut icon" href="./src/img/coffee-cup.png" type="image/x-icon" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
        <!-- Font Awesome CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <!-- My CSS -->
        <link rel="stylesheet" href="./src/css/main.css" />
        <link rel="stylesheet" href="./src/css/admin.css" />

        <style>
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }
            th,
            td {
                padding: 8px 12px;
                border: 1px solid #ccc;
                text-align: center;
            }
            button {
                min-width: 90px;
                padding: 5px 10px;
                cursor: pointer;
                border: none;
                border-radius: 4px;

            }
            select {
                padding: 4px;
            }
        </style>
    </head>
    <body style="background-color: #fff;">
        <div class="page-wrapper row" style="--bs-gutter-x: 0">
                <div class="sidebar col-md-2">
                    <div class="logo m-4">
                        <img src="./src/img/coffee-cup.png" alt="Chill Coffee Logo" class="icon" />
                        <p class="title"><span class="title strong">Chill</span> Coffee</p>
                    </div>
                    <ul class="menu p-0">
                        <li>
                            <a href="./admin_order.html" class="text-white">Đơn hàng</a>
                        </li>
                        <li>
                            <a href="./admin.html" class="text-white">Sản phẩm</a>
                        </li>
                        <li>
                            <a href="./admin_user.html" class="text-white">Quyền</a>
                        </li>
                        <li>
                            <a href="./index.html" class="text-white">Quay lại</a>
                        </li>
                    </ul>
                </div>
                <div class="content-admin col-md-10 p-3">
                    <h2>Quản lý người dùng</h2>
                    <div class="d-flex mt-3" style="gap: 24px;">
                        <input type="text" id="user-search" placeholder="Tìm theo tên người dùng" style="min-width: 400px;"/>
                        <select id="role-filter">
                            <option value="">Tất cả quyền</option>
                            <option value="2">Nhân viên</option>
                            <option value="3">Khách hàng</option>
                        </select>
                        <select id="status-filter">
                            <option value="">Tất cả trạng thái</option>
                            <option value="active">Đang hoạt động</option>
                            <option value="disabled">Đã khóa</option>
                        </select>
                    </div>
            
                    <table id="users-table">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Tên người dùng</th>
                                <th>Quyền</th>
                                <th>Trạng thái</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

        <script type="module" src="./src/js/admin_user.js"></script>

    </body>
</html>
